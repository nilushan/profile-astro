# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting and Functions on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Prepare functions directory
      - name: Copy dist to functions
        run: rm -rf functions/dist && cp -r dist functions/dist

      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci

      # Deploy both hosting and functions
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NILUSHANDEVELOPMENT }}
          channelId: live
          projectId: nilushandevelopment
          target: nilushansilva

      - name: Deploy Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project nilushandevelopment
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NILUSHANDEVELOPMENT }}
