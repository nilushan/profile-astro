# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting and Functions on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Prepare functions directory
      - name: Copy dist to functions
        run: rm -rf functions/dist && cp -r dist functions/dist

      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci

      # Deploy both hosting and functions
      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting,functions --project nilushandevelopment
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
