name: Validate and deploy Firebase preview
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Prepare functions directory
      - name: Copy dist to functions
        run: rm -rf functions/dist && cp -r dist functions/dist

      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci

      # Deploy the hosting preview. Omitting repoToken prevents the Firebase
      # action from creating a second, redundant GitHub check run.
      - name: Deploy hosting preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NILUSHANDEVELOPMENT }}
          projectId: nilushandevelopment
          target: nilushansilva

      # Firebase Hosting preview channels share deployed Cloud Functions. Deploy
      # the API from internal PRs so /api/chat exercises the same code as the PR.
      - name: Deploy chatbot function
        uses: jsryudev/deploy-firebase-functions@v20.0.1
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT: nilushandevelopment
          FUNCTIONS_DIR: functions

      - name: Smoke test chatbot API
        run: |
          curl --fail-with-body --retry 6 --retry-all-errors --retry-delay 10 \
            --request POST https://nilushansilva.web.app/api/chat \
            --header 'content-type: application/json' \
            --data '{"message":"Reply with OK if the portfolio chat service is available.","conversationHistory":[]}'
