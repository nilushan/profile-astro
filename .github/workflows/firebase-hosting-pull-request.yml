name: Deploy to Firebase Hosting and Functions on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Prepare functions directory
      - name: Copy dist to functions
        run: rm -rf functions/dist && cp -r dist functions/dist

      - name: Install functions dependencies
        working-directory: ./functions
        run: npm ci

      # Deploy preview with both hosting and functions
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NILUSHANDEVELOPMENT }}
          projectId: nilushandevelopment
          # Note: Functions are deployed to production even on PR previews
          # Only hosting gets a preview channel
